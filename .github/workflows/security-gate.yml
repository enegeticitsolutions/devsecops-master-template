name: DevSecOps Free Security Gate

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - master

jobs:

  # ==========================
  # 1. SECRET SCANNING
  # ==========================
  secret_scan:
    name: Scan for API & Secret Leaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh
          # Add bin directory to PATH for subsequent steps
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Run TruffleHog Scan
        run: |
          trufflehog git file://. --fail

  # ==========================
  # 2. SAST / CODE SCANNING
  # ==========================
  code_scan:
    name: Free Code Quality & Bug Scan
    runs-on: ubuntu-latest
    needs: secret_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep OSS
        run: |
          semgrep scan --config=auto --error

  # ==========================
  # 3. DEPENDENCY SCAN
  # ==========================
  dependency_scan:
    name: Third-Party Package Vulnerability Scan
    runs-on: ubuntu-latest
    needs: code_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
