name: DevSecOps Security Gate

on:
pull_request:
branches:
- main
- master

jobs:

secret_scan:
name: Secret Scan (TruffleHog)
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Install TruffleHog
    run: |
      curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh

  - name: Scan Git History
    run: |
      trufflehog git file://. \
        --only-verified \
        --fail
```

sast_scan:
name: SAST Scan (Semgrep)
runs-on: ubuntu-latest
needs: secret_scan

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.x'

  - name: Install Semgrep
    run: |
      pip install semgrep

  - name: Run Semgrep
    run: |
      semgrep scan \
        --config=auto \
        --error
```

dependency_scan:
name: Dependency Vulnerability Scan (Trivy)
runs-on: ubuntu-latest
needs: sast_scan

```
steps:
  - uses: actions/checkout@v4

  - name: Run Trivy
    uses: aquasecurity/trivy-action@0.33.1
    with:
      scan-type: fs
      scan-ref: .
      format: table
      exit-code: 1
      severity: CRITICAL,HIGH
```
